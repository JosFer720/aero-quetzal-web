name: aeroquetzal-snmp-panel
services:
  panel:
    image: nginx:1.27-alpine
    container_name: aq-snmp-panel
    network_mode: none
    restart: unless-stopped
    user: "101:101"
    entrypoint: [nginx]
    command: [-c, /etc/nginx/snmp.conf, -g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - ./nginx.conf:/etc/nginx/snmp.conf:ro
      - ./site:/usr/share/nginx/html:ro
      - /var/lib/aeroquetzal-snmp/panel:/srv/snmp:ro
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 15s
      timeout: 3s
      retries: 5
