worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /dev/stdout;
 sendfile on;
 server_tokens off;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 server {
  listen 8080;
  server_name snmp.aeroquetzal.internal;
  root /usr/share/nginx/html;
  index index.html;
  allow 10.10.0.48/28;
  allow 127.0.0.1;
  deny all;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  location = /health { default_type text/plain; return 200 'ok\n'; }
  location = /data/metrics.json { alias /srv/snmp/metrics.json; }
  location = /data/history.json { alias /srv/snmp/history.json; }
  location /data/ { deny all; }
  location / { try_files $uri $uri/ =404; }
 }
}
