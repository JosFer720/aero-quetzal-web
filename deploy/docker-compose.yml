name: aeroquetzal-web
x-restricted: &restricted
  network_mode: none
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }
services:
  postgres:
    <<: *restricted
    image: postgres:18-alpine
    container_name: aq-postgres
    # PostgreSQL entrypoint needs to initialize/chown its private data volume.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_DB: aeroquetzal
      POSTGRES_USER: aeroquetzal
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U aeroquetzal -d aeroquetzal']
      interval: 10s
      timeout: 5s
      retries: 10
  auth:
    <<: *restricted
    image: aeroquetzal/server:${RELEASE:?set RELEASE}
    container_name: aq-auth
    env_file: [./secrets/auth.env]
    command: [node, services/auth-service/dist/main.js]
    extra_hosts: [ldap.aeroquetzal.internal:10.10.0.102]
    volumes: [./secrets/ldap-ca.pem:/etc/aeroquetzal/ldap-ca.pem:ro]
    environment:
      NODE_ENV: production
      AUTH_HOST: 0.0.0.0
      AUTH_PORT: '8081'
      AUTH_MODE: ldap
      NODE_EXTRA_CA_CERTS: /etc/aeroquetzal/ldap-ca.pem
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  business-api:
    <<: *restricted
    image: aeroquetzal/server:${RELEASE:?set RELEASE}
    container_name: aq-business-api
    env_file: [./secrets/business.env]
    environment:
      NODE_ENV: production
      BUSINESS_HOST: 0.0.0.0
      BUSINESS_PORT: '8080'
      AUTH_URL: http://10.10.0.105:8081
      AUTH_ORIGIN: https://intranet.aeroquetzal.internal
      TRUSTED_PROXIES: 172.20.0.2,10.10.0.116
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
    name: aeroquetzal_postgres_data
secrets:
  postgres_password:
    file: ./secrets/postgres_password
