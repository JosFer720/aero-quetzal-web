error_log /var/log/nginx/error.log crit;
log_format aq_safe '$remote_addr $request_method $uri $status';
server {
    listen 80;
    server_name intranet.aeroquetzal.internal;
    return 308 https://intranet.aeroquetzal.internal$request_uri;
}
server {
    listen 443 ssl;
    server_name intranet.aeroquetzal.internal;
    ssl_certificate /etc/aeroquetzal/tls/fullchain.pem;
    ssl_certificate_key /etc/aeroquetzal/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Application roles are checked by Auth/API in addition to this network restriction.
    allow 10.10.0.0/27;
    allow 10.10.0.32/28;
    allow 10.10.0.48/28;
    allow 10.10.0.64/28;
    allow 10.200.0.0/24;
    allow 127.0.0.1;
    deny all;
    access_log /var/log/nginx/access.log aq_safe;
    include /etc/nginx/aq-headers.conf;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
    location ^~ /api/v1/auth/ {
        proxy_pass http://10.10.0.105:8081;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location ^~ /api/v1/internal/ {
        proxy_pass http://10.10.0.103:8080;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location /api/ { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
